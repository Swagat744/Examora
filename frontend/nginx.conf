server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Vite gives built files in /assets/ a content hash in their name,
  # so they can be cached "forever".
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Never cache index.html, so a new build is picked up immediately.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # React Router (BrowserRouter) handles URLs like /student or /login in the
  # browser. If the file doesn't exist on disk, serve index.html and let
  # React decide. Without this, refreshing /student would give a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
